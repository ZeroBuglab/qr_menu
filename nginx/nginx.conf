events {}
http {
  server_tokens off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  upstream web { server web:3000; }
  upstream api { server api:4000; }
  server {
    listen 80;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location /api/ { proxy_pass http://api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
    location /socket.io/ { proxy_pass http://api; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header Host $host; }
    location / { proxy_pass http://web; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  }
}
