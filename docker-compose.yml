services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: qrmenu
      POSTGRES_USER: qrmenu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qrmenu_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qrmenu -d qrmenu"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://qrmenu:${POSTGRES_PASSWORD:-qrmenu_dev}@postgres:5432/qrmenu?schema=public
      API_PORT: 4000
      WEB_ORIGIN: http://localhost
      COOKIE_SECRET: ${COOKIE_SECRET:?Set COOKIE_SECRET in .env}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-change-me-before-use}
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "cd /app && ./node_modules/.bin/prisma db push --schema packages/database/prisma/schema.prisma && ./node_modules/.bin/tsx packages/database/prisma/seed.ts && node apps/api/dist/server.js"
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on: [api]
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [web, api]
volumes:
  postgres_data:
